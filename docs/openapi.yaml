          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_services_seating.SeatSnapshot"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      summary: List event seats
      tags:
        - Events
  /events/{id}/seats/ws:
    get:
      description: Public websocket stream; emits a full SeatSnapshot immediately
        and after every reservation/config change.
      parameters:
        - description: Event UUID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "101":
          description: websocket upgrade
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      summary: Subscribe to seat updates
      tags:
        - Events
  /gate/check-in:
    post:
      consumes:
        - application/json
      description: Atomically checks in a confirmed ticket and immediately expires
        its single-use gate QR.
      parameters:
        - description: Gate QR token
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/internal_handlers.qrScanRequest"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_services.GateTicketView"
        "400":
          description: invalid or expired QR token
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "403":
          description: insufficient role
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "404":
          description: ticket not found
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "409":
          description: payment unconfirmed, event ended, or QR already used
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "429":
          description: rate limited
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      security:
        - BearerAuth, CookieAuth: []
      summary: Check in ticket
      tags:
        - Gate
  /gate/validate:
    post:
      consumes:
        - application/json
      description: Verifies a signed gate QR token and returns admission details without
        mutating state.
      parameters:
        - description: Gate QR token
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/internal_handlers.qrScanRequest"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_services.GateTicketView"
        "400":
          description: invalid or expired QR token
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "403":
          description: insufficient role
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "404":
          description: ticket not found
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "429":
          description: rate limited
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      security:
        - BearerAuth, CookieAuth: []
      summary: Validate gate QR
      tags:
        - Gate
  /health:
    get:
      description: Reports service health and PostgreSQL pool statistics.
      produces:
        - application/json
      responses:
        "200":
          description: healthy
          schema:
            additionalProperties: true
            type: object
        "503":
          description: database unavailable
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      summary: Health check
      tags:
        - System
  /help:
    post:
      consumes:
        - application/json
      description: Allows patrons/guests to submit help inquiries or payment issues
        to venue admins.
      parameters:
        - description: Help query details
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_services.CreateHelpRequest"
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_services.CreateHelpResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "429":
          description: rate limit exceeded
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      summary: Submit customer help request
      tags:
        - Support
  /tickets/{uuid}:
    get:
      description: Returns ticket, booking, and masked guest details; barcodes are
        omitted until payment is confirmed.
      parameters:
        - description: Ticket UUID
          in: path
          name: uuid
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_services.PublicTicketView"
        "400":
          description: invalid ticket uuid
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "404":
          description: ticket not found
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      summary: Get public ticket
      tags:
        - Tickets
  /tickets/{uuid}/image:
    get:
      description: Renders the confirmed ticket pass as a PNG image.
      parameters:
        - description: Ticket UUID
          in: path
          name: uuid
          required: true
          type: string
      produces:
        - image/png
      responses:
        "200":
          description: PNG image bytes
          schema:
            type: string
        "400":
          description: invalid ticket uuid
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "404":
          description: ticket not found
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "409":
          description: ticket not confirmed
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      summary: Get ticket PNG
      tags:
        - Tickets
securityDefinitions:
  BearerAuth:
    description: Staff access JWT in "Bearer <token>" format.
    in: header
    name: Authorization
    type: apiKey
  CookieAuth:
    description: HttpOnly staff access cookie used by browser clients.
    in: cookie
    name: venu_access
    type: apiKey
swagger: "2.0"
