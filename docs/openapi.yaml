info:
  contact: {}
  description: General Admission Ticketing & F&B Wallet Backend.
  title: House Untold Ticketing API
  version: "1.0"
paths:
  /admin/artists/{id}:
    delete:
      description: Removes an artist from an event.
      parameters:
        - description: Artist UUID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      security:
        - BearerAuth, CookieAuth: []
      summary: Delete event artist
      tags:
        - Admin
  /admin/audit-logs:
    get:
      description: Returns structured API call audit records; request bodies and secrets
        are never stored.
      parameters:
        - description: Optional staff UUID filter
          in: query
          name: actor_id
          type: string
        - description: Optional request path substring filter
          in: query
          name: path
          type: string
        - description: Page size (default 50)
          in: query
          name: limit
          type: integer
        - description: Page offset
          in: query
          name: offset
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "403":
          description: insufficient role
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      security:
        - BearerAuth, CookieAuth: []
      summary: List API audit logs
      tags:
        - Admin
  /admin/bookings:
    get:
      description: Returns the manual UPI verification queue with UTRs and expected
        amounts.
      parameters:
        - description: Booking status (default PENDING)
          in: query
          name: status
          type: string
        - description: Optional event UUID filter
          in: query
          name: event_id
          type: string
        - description: Page size (default 50)
          format: int32
          in: query
          name: limit
          type: integer
        - description: Page offset
          format: int32
          in: query
          name: offset
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "403":
          description: insufficient role
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      security:
        - BearerAuth, CookieAuth: []
      summary: List bookings for verification
      tags:
        - Admin
  /admin/bookings/{id}/verify:
    post:
      consumes:
        - application/json
      description: Atomically approves or rejects a pending booking and queues WhatsApp
        delivery on approval.
      parameters:
        - description: Booking UUID
          in: path
          name: id
          required: true
          type: string
        - description: APPROVE or REJECT decision
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_services.VerifyBookingRequest"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_services.VerifyBookingResponse"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "403":
          description: insufficient role
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "404":
          description: booking not found
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "409":
          description: booking is no longer pending
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      security:
        - BearerAuth, CookieAuth: []
      summary: Verify booking payment
      tags:
        - Admin
  /admin/tickets/search:
    get:
      description: Finds confirmed ticket passes by contact phone, guest name, or
        UTR so admins can resend or redownload them.
      parameters:
        - description: Phone number, guest name, or UTR
          in: query
          name: q
          type: string
        - description: Page size (default 20, max 50)
          in: query
          name: limit
          type: integer
        - description: Page offset
          in: query
          name: offset
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.Envelope"
        "400":
          description: invalid limit or offset
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "403":
          description: insufficient role
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      security:
        - BearerAuth, CookieAuth: []
      summary: Search confirmed tickets
      tags:
        - Admin
  /admin/events:
    get:
      description: Returns all events with confirmed booking, revenue, and check-in
        totals.
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "403":
          description: insufficient role
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      security:
        - BearerAuth, CookieAuth: []
      summary: List admin events
      tags:
        - Admin
    post:
      consumes:
        - application/json
      description: Creates a ticketing event with status DRAFT, ONSALE, SOLDOUT, or
        ENDED.
      parameters:
        - description: Event details
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_services.CreateEventRequest"
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_db.Event"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "403":
          description: insufficient role
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      security:
        - BearerAuth, CookieAuth: []
      summary: Create event
      tags:
        - Admin
  /admin/events/{id}:
    put:
      consumes:
        - application/json
      description: Updates event title, description, timings, status, venue, area,
        transit, and advisory.
      parameters:
        - description: Event UUID
          in: path
          name: id
          required: true
          type: string
        - description: Event update payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_services.UpdateEventRequest"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_db.Event"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      security:
        - BearerAuth, CookieAuth: []
      summary: Update event details
      tags:
        - Admin
    delete:
      description: Hides an event from public and admin event reads without removing
        its bookings.
      parameters:
        - description: Event UUID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "403":
          description: insufficient role
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "404":
          description: event not found
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      security:
        - BearerAuth, CookieAuth: []
      summary: Soft delete event
      tags:
        - Admin
  /admin/events/{id}/artists:
    get:
      description: Lists all artists linked to an event.
      parameters:
        - description: Event UUID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      security:
        - BearerAuth, CookieAuth: []
      summary: List event artists
      tags:
        - Admin
    post:
      consumes:
        - application/json
      description: Adds a performing artist, headliner, or DJ to an event.
      parameters:
        - description: Event UUID
          in: path
          name: id
          required: true
          type: string
        - description: Artist payload
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_services.CreateArtistRequest"
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_db.EventArtist"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      security:
        - BearerAuth, CookieAuth: []
      summary: Create event artist
      tags:
        - Admin
  /admin/events/{id}/seating:
    put:
      consumes:
        - application/json
      description: Sets table counts and per-person prices for sections A/B/C and
        table sizes 10/15.
      parameters:
        - description: Event UUID
          in: path
          name: id
          required: true
          type: string
        - description: Seating configuration
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/internal_handlers.configureSeatingRequest"
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_services_seating.SeatSnapshot"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "403":
          description: Forbidden
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "404":
          description: Not Found
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "409":
          description: Conflict
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      security:
        - BearerAuth, CookieAuth: []
      summary: Configure event seating
      tags:
        - Admin
  /admin/events/{id}/tiers:
    post:
      consumes:
        - application/json
      description: Adds a category/tier to an existing event.
      parameters:
        - description: Event UUID
          in: path
          name: id
          required: true
          type: string
        - description: Ticket tier
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_services.CreateTicketTierRequest"
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_db.TicketCategory"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "403":
          description: insufficient role
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "404":
          description: event not found
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      security:
        - BearerAuth, CookieAuth: []
      summary: Create ticket tier
      tags:
        - Admin
  /admin/help:
    get:
      consumes:
        - application/json
      description: Returns customer support inquiries with optional resolved filter
        and pagination.
      parameters:
        - description: Filter by resolved status
          in: query
          name: resolved
          type: boolean
        - description: Page limit (default 50)
          in: query
          name: limit
          type: integer
        - description: Page offset (default 0)
          in: query
          name: offset
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "403":
          description: insufficient role
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      security:
        - BearerAuth, CookieAuth: []
      summary: List customer help queries
      tags:
        - Admin
  /admin/help/{id}/resolve:
    post:
      consumes:
        - application/json
      description: Marks a customer support inquiry as resolved by the authenticated
        admin.
      parameters:
        - description: Help Message UUID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "403":
          description: insufficient role
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "404":
          description: help message not found
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      security:
        - BearerAuth, CookieAuth: []
      summary: Resolve customer help query
      tags:
        - Admin
  /admin/staff:
    get:
      description: Lists all staff accounts with their roles and status.
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: "#/definitions/github_com_venu-live_venu-api_internal_services.StaffAccountView"
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "403":
          description: insufficient role
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      security:
        - BearerAuth, CookieAuth: []
      summary: List all staff
      tags:
        - Admin
    post:
      consumes:
        - application/json
      description: Creates an ADMIN, SCANNER, or BARTENDER account.
      parameters:
        - description: Staff account
          in: body
          name: payload
          required: true
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_services.CreateStaffRequest"
      produces:
        - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_services.StaffAccountView"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "403":
          description: insufficient role
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "409":
          description: username already exists
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      security:
        - BearerAuth, CookieAuth: []
      summary: Create staff account
      tags:
        - Admin
  /admin/staff/{id}:
    delete:
      description: Deactivates a staff account and revokes all previously issued sessions.
      parameters:
        - description: Staff UUID
          in: path
          name: id
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_services.StaffAccountView"
        "400":
          description: Bad Request
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "401":
          description: Unauthorized
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "403":
          description: insufficient role or self-deactivation
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "404":
          description: staff account not found
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
        "500":
          description: Internal Server Error
          schema:
            $ref: "#/definitions/github_com_venu-live_venu-api_internal_httpx.ErrorPayload"
      security:
        - BearerAuth, CookieAuth: []
      summary: Deactivate staff account
      tags:
        - Admin
  /admin/staff/{id}/password:
    patch:
      consumes:
        - application/json
      description: Updates a staff password and revokes all previously issued sessions.
      parameters:
        - description: Staff UUID
          in: path
          name: id
          required: true
          type: string
        - description: New password
          in: body
          name: payload
          required: true
          schema:
